modes:
  mechanical: prom_ext   # knee extension limit = passive max extension (goniometer)
  functional: arom_ext   # knee extension limit = max extension actually reached at trot (capped by the passive limit: ext = min(prom_ext, this))
grades:
  0:
    measured: true
    prom_ext: 162.9      # stifle passive max extension
    prom_flex: 44.7      # stifle passive max flexion
    arom_ext: 167.1      # stifle MEA at trot (> passive 162.9: different protocols, ~4 deg)
    knee_arom: 48.93     # AROM = MEA - MFA (median, IQR 45.26-55.66)
    knee_mfa: 121.8      # stifle max flexion angle at trot
    hip_arom: 19.02
    hip_mea: 142.1
    hip_mfa: 122.9
    hock_arom: 47.59
    hock_mea: 157.4
    hock_mfa: 105.8
